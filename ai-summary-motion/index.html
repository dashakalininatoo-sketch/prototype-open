<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Циан AI Summary — motion concepts</title>
<style>
  :root{
    --cian:#0B66FF;
    --ink:#111827;
    --muted:#6B7280;
    --line:#E5E7EB;
    --bg:#F5F7FA;
    --card:#FFFFFF;
    --surface:#FFFFFF;
    --surface-soft:#F5F7FA;
    --summary-start:#F8FAFF;
    --summary-end:#FFFFFF;
    --summary-line:#DCE7FF;
    --note:#F9FAFB;
    --note-line:#E2E8F0;
    --tag:#F2F4F7;
    --tag-ink:#4B5563;
    --shadow:rgba(17,24,39,.06);
    --warm:#FFB000;
    --warm2:#FF7A00;
    --soft:#EDF3FF;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ink:#F3F6FC;
    --muted:#A7B0C0;
    --line:#30394A;
    --bg:#0E1117;
    --card:#171C25;
    --surface:#1D2430;
    --surface-soft:#252D3A;
    --summary-start:#18243A;
    --summary-end:#1A202B;
    --summary-line:#30486F;
    --note:#202733;
    --note-line:#3A4659;
    --tag:#272F3D;
    --tag-ink:#C8D0DE;
    --shadow:rgba(0,0,0,.32);
    --soft:#162B50;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--ink);
    transition:background-color .25s ease,color .25s ease;
  }
  .shell{
    max-width:1200px;
    margin:0 auto;
    padding:28px 24px 56px;
  }
  .top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:22px;
  }
  h1{font-size:28px;line-height:1.1;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px}
  .controls{
    display:flex;flex-wrap:wrap;gap:8px;
  }
  button{
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    padding:10px 14px;
    border-radius:999px;
    font-weight:650;
    cursor:pointer;
  }
  button.active{
    background:var(--cian);
    color:white;
    border-color:var(--cian);
  }
  button.replay{
    border-color:#668CD8;
    color:var(--cian);
  }
  .theme-switch{
    min-height:40px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:5px 11px 5px 7px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface);
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
  }
  .theme-switch input{position:absolute;opacity:0;pointer-events:none}
  .switch-track{
    width:36px;height:22px;padding:2px;border-radius:999px;
    background:#C9D0DB;transition:background-color .2s ease;
  }
  .switch-thumb{
    display:block;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.24);
    transition:transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .theme-switch input:checked + .switch-track{background:var(--cian)}
  .theme-switch input:checked + .switch-track .switch-thumb{transform:translateX(14px)}
  .theme-switch input:focus-visible + .switch-track{outline:3px solid rgba(11,102,255,.28);outline-offset:2px}

  .compare{
    max-width:720px;
    margin:0 auto;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 12px 30px var(--shadow);
  }
  .panel-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .tag{
    font-size:12px;font-weight:750;letter-spacing:.02em;
    padding:6px 9px;border-radius:999px;background:var(--tag);color:var(--tag-ink);
  }
  .tag.ai{background:var(--soft);color:var(--cian)}
  .screen{
    min-height:680px;
    padding:22px;
  }

  .listing{
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    margin-bottom:16px;
    background:var(--surface);
  }
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .listing h3{margin:0;font-size:18px}
  .meta{color:var(--muted);font-size:13px;margin-top:5px}
  .price{font-weight:800;font-size:18px;white-space:nowrap}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-size:12px;padding:7px 9px;background:var(--surface-soft);border-radius:999px;color:var(--ink)}

  .summary{
    border-radius:20px;
    padding:18px;
    background:linear-gradient(180deg,var(--summary-start) 0%,var(--summary-end) 100%);
    border:1px solid var(--summary-line);
    position:relative;
    overflow:hidden;
  }
  .summary-title{
    display:flex;align-items:center;gap:10px;
    font-weight:800;font-size:16px;margin-bottom:14px;
  }
  .spark{
    width:22px;height:22px;border-radius:7px;background:var(--cian);
    position:relative;flex:0 0 auto;
  }
  .spark:after{
    content:"";position:absolute;width:6px;height:6px;border-radius:50%;
    background:var(--warm);right:-2px;top:-2px;
  }

  .text p{margin:0 0 11px;line-height:1.48;font-size:15px}
  .text strong{font-weight:800}
  .foot{margin-top:14px;padding-top:12px;border-top:1px solid #E7ECF5;font-size:12px;color:var(--muted)}

  /* concept 1 — windows */
  .windows .chunk{opacity:0;filter:blur(4px);display:inline}
  .windows.run .chunk{
    animation:windowOn .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .windows.run .c1{animation-delay:.05s}
  .windows.run .c2{animation-delay:.22s}
  .windows.run .c3{animation-delay:.39s}
  .windows.run .c4{animation-delay:.56s}
  .windows.run .c5{animation-delay:.73s}
  @keyframes windowOn{
    0%{opacity:0;filter:blur(4px);color:#F1AF11;text-shadow:0 0 0 rgba(241,175,17,0)}
    45%{opacity:1;filter:blur(0);color:#F1AF11;text-shadow:0 0 16px rgba(241,175,17,.24)}
    100%{opacity:1;filter:blur(0);color:inherit;text-shadow:none}
  }

  /* concept 2 — moves in */
  .movein .line{opacity:0;transform:translateX(12px)}
  .movein.run .line{animation:moveIn .5s cubic-bezier(.16,1,.3,1) forwards}
  .movein.run .l1{animation-delay:.05s}
  .movein.run .l2{animation-delay:.18s}
  .movein.run .l3{animation-delay:.31s}
  .movein.run .l4{animation-delay:.44s}
  @keyframes moveIn{
    0%{opacity:0;transform:translateX(12px);letter-spacing:.02em}
    100%{opacity:1;transform:translateX(0);letter-spacing:normal}
  }

  /* concept 3 — meaning charge */
  .charge .line{opacity:0}
  .charge.run .line{animation:fadeLine .25s ease forwards}
  .charge.run .l1{animation-delay:.02s}
  .charge.run .l2{animation-delay:.12s}
  .charge.run .l3{animation-delay:.22s}
  .charge.run .l4{animation-delay:.32s}
  @keyframes fadeLine{to{opacity:1}}
  .entity{
    position:relative;
    display:inline-block;
    font-weight:800;
  }
  .charge.run .entity:after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-2px;height:2px;border-radius:3px;
    transform:scaleX(0);
    transform-origin:left center;
    background:#F4631B;
    box-shadow:0 0 8px rgba(244,99,27,.28);
    animation:chargeSweep .36s cubic-bezier(.2,.9,.2,1) forwards;
  }
  .charge.run .e1:after{animation-delay:.48s}
  .charge.run .e2:after{animation-delay:.66s}
  .charge.run .e3:after{animation-delay:.84s}
  .charge.run .e4:after{animation-delay:1.02s}
  @keyframes chargeSweep{
    0%{transform:scaleX(0);opacity:0}
    18%{opacity:1}
    75%{transform:scaleX(1);opacity:1}
    100%{transform:scaleX(1);opacity:0}
  }

  /* concept 4 — finds its place */
  .place .word{display:inline-block;opacity:0}
  .place.run .word{animation:placeWord .48s cubic-bezier(.16,1,.3,1) forwards}
  .place.run .w1{animation-delay:.02s;--x:-8px;--y:3px}
  .place.run .w2{animation-delay:.07s;--x:6px;--y:-2px}
  .place.run .w3{animation-delay:.12s;--x:-3px;--y:-4px}
  .place.run .w4{animation-delay:.17s;--x:8px;--y:3px}
  .place.run .w5{animation-delay:.22s;--x:-7px;--y:2px}
  @keyframes placeWord{
    0%{opacity:0;transform:translate(var(--x),var(--y))}
    100%{opacity:1;transform:translate(0,0)}
  }

  /* concept 5 — route */
  .routeWrap{display:grid;grid-template-columns:18px 1fr;gap:10px}
  .rail{position:relative;min-height:150px}
  .rail:before{
    content:"";position:absolute;top:8px;bottom:8px;left:8px;width:2px;
    border-radius:999px;background:var(--surface-soft);
  }
  .rail:after{
    content:"";position:absolute;top:8px;bottom:8px;left:8px;width:2px;
    border-radius:999px;background:#F4631B;
    transform:scaleY(0);transform-origin:top center;
  }
  .route.run .rail:after{animation:routeProgress 1.25s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes routeProgress{to{transform:scaleY(1)}}
  .route .line{opacity:0;transform:translateY(4px)}
  .route.run .line{animation:routeLine .35s ease forwards}
  .route.run .l1{animation-delay:.12s}
  .route.run .l2{animation-delay:.42s}
  .route.run .l3{animation-delay:.72s}
  .route.run .l4{animation-delay:1.02s}
  @keyframes routeLine{to{opacity:1;transform:translateY(0)}}

  .concept-note{
    margin-top:12px;font-size:12px;color:var(--muted);
    background:var(--note);border:1px dashed var(--note-line);border-radius:12px;padding:10px 12px;
  }

  @media (max-width:900px){
    .top{align-items:flex-start;flex-direction:column}
    .screen{min-height:auto}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <h1>Циан AI Summary — motion concepts</h1>
      <div class="sub">Пять вариантов анимации появления AI-саммари.</div>
    </div>
    <div class="controls">
      <button data-concept="windows" class="active">Свет в окнах</button>
      <button data-concept="movein">Въезжает</button>
      <button data-concept="charge">Заряд смысла</button>
      <button data-concept="place">Находит место</button>
      <button data-concept="route">Маршрут</button>
      <button class="replay" id="replay">↻ Replay</button>
      <label class="theme-switch" for="themeToggle">
        <input id="themeToggle" type="checkbox" role="switch" aria-label="Включить тёмную тему" />
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span id="themeLabel">Тёмная тема</span>
      </label>
    </div>
  </div>

  <div class="compare">
    <section class="panel">
      <div class="panel-head">
        <strong>Анимация саммари</strong>
        <span class="tag ai" id="conceptTag">Свет в окнах</span>
      </div>
      <div class="screen">
        <div class="listing">
          <div class="row">
            <div>
              <h3>2-комн. квартира, 58 м²</h3>
              <div class="meta">Москва · м. Аэропорт · 8 минут пешком</div>
            </div>
            <div class="price">18,4 млн ₽</div>
          </div>
          <div class="chips">
            <span class="chip">8/14 этаж</span>
            <span class="chip">Кухня 12 м²</span>
            <span class="chip">Дом 2016</span>
            <span class="chip">Без отделки</span>
          </div>
        </div>

        <div id="demo"></div>
      </div>
    </section>
  </div>
</div>

<script>
const content = {
  windows: `
    <div class="summary windows">
      <div class="summary-title"><span class="spark"></span>AI-саммари по объекту</div>
      <div class="text">
        <p><span class="chunk c1"><strong>В целом вариант выглядит сильным</strong></span><span class="chunk c2">: хорошая транспортная доступность и современный дом.</span></p>
        <p><span class="chunk c3">Цена примерно <strong>на 6% выше похожих предложений</strong> в районе, но это частично компенсируется площадью и этажом.</span></p>
        <p><span class="chunk c4">Главный компромисс — <strong>квартира без отделки</strong>, поэтому стоит заложить дополнительный бюджет на ремонт.</span></p>
        <p><span class="chunk c5">Если приоритет — жить рядом с метро и не рассматривать старый фонд, объект стоит добавить в шорт-лист.</span></p>
      </div>
      <div class="concept-note">Метафора: смысл «зажигается» островками, как окна в доме. Не печать, а проявление.</div>
    </div>`,
  movein: `
    <div class="summary movein">
      <div class="summary-title"><span class="spark"></span>AI-саммари по объекту</div>
      <div class="text">
        <p class="line l1"><strong>В целом вариант выглядит сильным</strong>: хорошая транспортная доступность и современный дом.</p>
        <p class="line l2">Цена примерно <strong>на 6% выше похожих предложений</strong> в районе, но это частично компенсируется площадью и этажом.</p>
        <p class="line l3">Главный компромисс — <strong>квартира без отделки</strong>, поэтому стоит заложить дополнительный бюджет на ремонт.</p>
        <p class="line l4">Если приоритет — жить рядом с метро и не рассматривать старый фонд, объект стоит добавить в шорт-лист.</p>
      </div>
      <div class="concept-note">Метафора: каждая мысль буквально «въезжает» в своё место. Очень мягкий сдвиг, почти на уровне ощущения.</div>
    </div>`,
  charge: `
    <div class="summary charge">
      <div class="summary-title"><span class="spark"></span>AI-саммари по объекту</div>
      <div class="text">
        <p class="line l1"><strong class="entity e1">В целом вариант выглядит сильным</strong>: хорошая транспортная доступность и современный дом.</p>
        <p class="line l2">Цена примерно <strong class="entity e2">на 6% выше похожих предложений</strong> в районе, но это частично компенсируется площадью и этажом.</p>
        <p class="line l3">Главный компромисс — <strong class="entity e3">квартира без отделки</strong>, поэтому стоит заложить дополнительный бюджет на ремонт.</p>
        <p class="line l4">Если приоритет — <strong class="entity e4">жить рядом с метро</strong> и не рассматривать старый фонд, объект стоит добавить в шорт-лист.</p>
      </div>
      <div class="concept-note">Метафора: фирменный «заряд» не красит весь текст, а пробегает по главным выводам и помогает читать.</div>
    </div>`,
  place: `
    <div class="summary place">
      <div class="summary-title"><span class="spark"></span>AI-саммари по объекту</div>
      <div class="text">
        <p>
          <span class="word w1"><strong>В целом</strong></span>
          <span class="word w2"><strong>вариант</strong></span>
          <span class="word w3"><strong>выглядит</strong></span>
          <span class="word w4"><strong>сильным</strong></span><span class="word w5">: хорошая транспортная доступность и современный дом.</span>
        </p>
        <p><span class="word w1">Цена примерно</span> <span class="word w2"><strong>на 6% выше похожих предложений</strong></span> <span class="word w3">в районе, но это частично компенсируется площадью и этажом.</span></p>
        <p><span class="word w2">Главный компромисс —</span> <span class="word w4"><strong>квартира без отделки</strong>,</span> <span class="word w5">поэтому стоит заложить дополнительный бюджет на ремонт.</span></p>
        <p><span class="word w1">Если приоритет — жить рядом с метро и не рассматривать старый фонд, объект стоит добавить в шорт-лист.</span></p>
      </div>
      <div class="concept-note">Метафора: слова чуть «ищут координату» и собираются в финальную типографическую сетку.</div>
    </div>`,
  route: `
    <div class="summary route">
      <div class="summary-title"><span class="spark"></span>AI-саммари по объекту</div>
      <div class="routeWrap">
        <div class="rail" aria-hidden="true"></div>
        <div class="text">
          <p class="line l1"><strong>В целом вариант выглядит сильным</strong>: хорошая транспортная доступность и современный дом.</p>
          <p class="line l2">Цена примерно <strong>на 6% выше похожих предложений</strong> в районе, но это частично компенсируется площадью и этажом.</p>
          <p class="line l3">Главный компромисс — <strong>квартира без отделки</strong>, поэтому стоит заложить дополнительный бюджет на ремонт.</p>
          <p class="line l4">Если приоритет — жить рядом с метро и не рассматривать старый фонд, объект стоит добавить в шорт-лист.</p>
        </div>
      </div>
      <div class="concept-note">Метафора: прогресс заполняет маршрут сверху вниз и последовательно открывает выводы.</div>
    </div>`
};

const labels = {
  windows:"Свет в окнах",
  movein:"Въезжает",
  charge:"Заряд смысла",
  place:"Находит место",
  route:"Маршрут"
};

let current = "windows";
const demo = document.getElementById("demo");
const tag = document.getElementById("conceptTag");
const themeToggle = document.getElementById("themeToggle");
const themeLabel = document.getElementById("themeLabel");

function applyTheme(theme){
  const isDark = theme === "dark";
  document.documentElement.dataset.theme = isDark ? "dark" : "light";
  themeToggle.checked = isDark;
  themeToggle.setAttribute("aria-label", isDark ? "Включить светлую тему" : "Включить тёмную тему");
  themeLabel.textContent = isDark ? "Светлая тема" : "Тёмная тема";
  try{ localStorage.setItem("ai-summary-theme", isDark ? "dark" : "light"); }catch(e){}
}

function mount(name){
  current = name;
  demo.innerHTML = content[name];
  tag.textContent = labels[name];
  document.querySelectorAll('[data-concept]').forEach(b => b.classList.toggle('active', b.dataset.concept === name));
  requestAnimationFrame(() => requestAnimationFrame(() => demo.querySelector('.summary')?.classList.add('run')));
}
function replay(){
  const el = demo.querySelector('.summary');
  if(!el) return;
  el.classList.remove('run');
  void el.offsetWidth;
  el.classList.add('run');
}
document.querySelectorAll('[data-concept]').forEach(btn => btn.addEventListener('click',()=>mount(btn.dataset.concept)));
document.getElementById('replay').addEventListener('click',replay);
themeToggle.addEventListener('change',()=>applyTheme(themeToggle.checked ? "dark" : "light"));
let savedTheme = "light";
try{ savedTheme = localStorage.getItem("ai-summary-theme") || "light"; }catch(e){}
applyTheme(savedTheme);
mount(current);
</script>
</body>
</html>
