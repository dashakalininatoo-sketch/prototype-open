<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои объявления · Final design (прототип)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/posutochno.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="logo"><svg viewBox="0 0 28 28"><path d="M3 22 14 4l4 6.5L13 19l-3-2-3.5 5H3Z" fill="#0054fd"/><path d="M15.5 21.5 20 14l5 8h-9.5Z" fill="#0054fd"/></svg>Циан</div>
    <div class="sp"></div>
    <span class="tic" data-tip="Сравнение"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="9" height="11" rx="2"/><path d="M8 17h7a2 2 0 0 0 2-2V8"/></svg></span>
    <span class="tic" data-tip="Сообщения"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 3c4.4 0 7.5 2.7 7.5 6.2S14.4 15.4 10 15.4c-.9 0-1.7-.1-2.5-.3L4 16.8l.8-3.1C3.3 12.6 2.5 11 2.5 9.2 2.5 5.7 5.6 3 10 3Z"/></svg><i></i></span>
    <span class="tic" data-tip="Избранное"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 16.5 9 15.6C5 12 2.5 9.8 2.5 7.1 2.5 5 4.1 3.4 6.2 3.4c1.2 0 2.4.6 3.1 1.5h1.4c.7-.9 1.9-1.5 3.1-1.5 2.1 0 3.7 1.6 3.7 3.7 0 2.7-2.5 4.9-6.5 8.5l-1 .9Z"/></svg></span>
    <span class="tic" data-tip="Поиск по карте"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4" stroke-linecap="round"/></svg><i></i></span>
    <span class="tic" data-tip="Уведомления"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 13.5V9a5 5 0 0 1 10 0v4.5l1.4 1.5H3.6L5 13.5ZM8.2 17.2h3.6" stroke-linecap="round"/></svg><i></i></span>
    <button class="btn-sell" data-act="nav"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M8 2.5v11M2.5 8h11"/></svg>Продать за 0 ₽</button>
    <span class="ava"></span>
  </div>
  <nav class="nav"><a>Аренда</a><a>Продажа</a><a>Новостройки</a><a>Дома и участки</a><a>Коммерческая</a><a>Ипотека</a><a>Мой дом</a><a>Сервисы</a><a>Сделка</a><a>Приложение Циан</a><a style="display:flex;gap:6px;align-items:center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#152242" stroke-width="1.6"><circle cx="7" cy="7" r="4"/><circle cx="11" cy="11" r="4"/></svg>Glorax Development</a></nav>
</header>
<div class="wrap">
  <aside class="side">
    <a class="back" data-act="nav"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11H4M9 6l-5 5 5 5"/></svg>Все сервисы</a>
    <a class="on"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="4" width="17" height="13" rx="2"/><path d="M2.5 8.5h17M8 8.5V17"/></svg>Объявления</a>
    <a data-act="nav"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="5" width="14" height="13" rx="2"/><path d="M8 3v3M14 3v3M8 10v5M11 10v5M14 10v5" stroke-linecap="round"/></svg>Брони и гости</a>
    <a data-act="nav"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4.5" width="16" height="14" rx="2"/><path d="M3 9h16M7.5 2.5v4M14.5 2.5v4" stroke-linecap="round"/></svg>Календарь бронирований</a>
    <a data-act="nav"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2.5 5.5c0-.8.7-1.5 1.5-1.5h4.5l2 2.2H18c.8 0 1.5.7 1.5 1.5v9.3c0 .8-.7 1.5-1.5 1.5H4c-.8 0-1.5-.7-1.5-1.5V5.5Z"/></svg>Отчёты о бронях</a>
    <a data-act="nav"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14.5 3.5 18.5 7.5 8 18H4v-4L14.5 3.5Z"/></svg>Данные о бизнесе</a>
    <div class="grow"></div>
    <a data-act="nav"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3.5" width="16" height="15" rx="2"/><path d="M8.5 3.5v15"/></svg>Свернуть меню</a>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="tip" id="tip"></div>
<div class="toasts" id="toasts"></div>
<div class="badge">Прототип · данные условные</div>
<script src="js/photos.js"></script>
<script src="js/posutochno.js"></script>
</body>
</html>
